name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    # Runs automatically only in the public repository; a private copy runs it on manual dispatch only.
    if: github.repository == 'avcibunyamin/PromptBridge' || github.event_name == 'workflow_dispatch'
    name: backend (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-orchestrator/requirements.txt
      - name: Git identity for tests that commit
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"
      - name: Install
        working-directory: ai-orchestrator
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
      - name: Tests (no provider calls)
        working-directory: ai-orchestrator
        run: .venv/bin/python -m unittest discover -s tests

  ui:
    if: github.repository == 'avcibunyamin/PromptBridge' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ai-orchestrator/ui/package-lock.json
      - name: Install, test, build
        working-directory: ai-orchestrator/ui
        run: |
          npm ci
          npm test
          npm run build
      - name: Built panel matches the sources
        run: |
          changes="$(git status --porcelain -- ai-orchestrator/app/static)"
          if [ -n "$changes" ]; then
            echo "app/static differs from a fresh build; run npm run build and commit the result:"
            echo "$changes"
            exit 1
          fi
